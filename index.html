<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Min-Redir Pro | SaaS Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --bg: #020617;
            --sidebar-bg: rgba(15, 23, 42, 0.7);
            --card-bg: rgba(30, 41, 59, 0.4);
            --border: rgba(255, 255, 255, 0.06);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
            --danger: #f43f5e;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        aside {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            z-index: 50;
        }

        .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; display: flex; align-items: center; gap: 10px; color: white; }
        
        .user-profile { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
        .avatar { width: 36px; height: 36px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; }

        .group-item { padding: 12px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--text-dim); margin-bottom: 4px; }
        .group-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .group-item.active { background: var(--primary); color: white; box-shadow: 0 4px 15px var(--primary-glow); }

        main { flex: 1; padding: 40px; overflow-y: auto; position: relative; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 20px; display: flex; align-items: center; gap: 15px; }
        .stat-val { font-size: 1.5rem; font-weight: 800; display: block; }
        .stat-label { font-size: 0.8rem; color: var(--text-dim); }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 30px; margin-bottom: 30px; }
        
        .script-box { background: #000; padding: 20px; border-radius: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: #10b981; position: relative; border: 1px solid var(--border); line-height: 1.6; margin-top: 15px; }

        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #020617; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); padding: 50px; border-radius: 30px; width: 420px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }

        input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; outline: none; }
        input:focus { border-color: var(--primary); }

        .btn { padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; justify-content: center; }
        .btn-primary { background: var(--primary); color: white; width: 100%; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

        .btn-danger { background: var(--danger); color: white; padding: 6px 12px; font-size: 0.75rem; border-radius: 6px; border: none; cursor: pointer; }
        .btn-danger:hover { opacity: 0.8; transform: scale(1.05); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 15px; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        
        #toast { position: fixed; bottom: 30px; right: 30px; padding: 15px 25px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; z-index: 10000; transform: translateY(200px); }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="toast">Action Successful</div>

    <div id="authOverlay">
        <div class="auth-card">
            <h2 style="margin-bottom: 10px;">Welcome</h2>
            <p style="color: var(--text-dim); margin-bottom: 30px;">Login to your dashboard</p>
            <div id="authError" style="display:none; color: var(--danger); margin-bottom: 15px; font-size: 0.8rem;"></div>
            <input type="email" id="authEmail" placeholder="Email">
            <input type="password" id="authPassword" placeholder="Password">
            <button class="btn btn-primary" onclick="handleAuth()">Login</button>
            <p style="margin-top: 20px; font-size: 0.8rem; color: var(--text-dim);">New here? <a href="#" onclick="toggleMode()" style="color: var(--primary)">Sign Up</a></p>
        </div>
    </div>

    <aside id="sidebar" style="display:none;">
        <div class="logo"><i data-lucide="zap"></i> RedirPro</div>
        <div class="user-profile">
            <div class="avatar" id="avatar">U</div>
            <div style="overflow:hidden"><div id="userName" style="font-weight:600; font-size:0.9rem;">User</div></div>
        </div>
        <div id="groupList"></div>
        <button class="btn btn-outline" style="margin-top:20px;" onclick="createGroup()"><i data-lucide="plus"></i> New Group</button>
        <div style="margin-top:auto;">
            <button class="group-item" style="width:100%" onclick="logout()"><i data-lucide="log-out"></i> Logout</button>
        </div>
    </aside>

    <main id="mainContent" style="display:none;">
        <h2 id="currentGroup">Dashboard</h2>
        <div class="stats-grid">
            <div class="stat-card"><div><span class="stat-val" id="statClicks">0</span><span class="stat-label">Clicks</span></div></div>
            <div class="stat-card"><div><span class="stat-val" id="statRedirects">0</span><span class="stat-label">Redirects</span></div></div>
            <div class="stat-card"><div><span class="stat-val" style="color:var(--success)">Live</span><span class="stat-label">Status</span></div></div>
        </div>

        <div class="card">
            <h3>Master Script</h3>
            <div class="script-box" id="scriptBox">// Loading...</div>
            <button class="btn btn-outline" style="margin-top:10px" onclick="copyScript()">Copy Script</button>
        </div>

        <div class="card">
            <h3>Recent Traffic</h3>
            <div id="recentTraffic" style="font-size: 0.85rem; color: var(--text-dim);">
                No clicks tracked yet.
            </div>
        </div>

        <div class="card">
            <h3>Mappings</h3>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="text" id="newId" placeholder="Post ID" style="margin:0">
                <input type="text" id="newUrl" placeholder="Target URL" style="margin:0">
                <button class="btn btn-primary" onclick="addMap()" style="width:auto">Add</button>
            </div>
            <table>
                <thead><tr><th>Post ID</th><th>Target</th><th style="text-align:right">Action</th></tr></thead>
                <tbody id="mapList"></tbody>
            </table>
        </div>
    </main>

    <script>
        let _config = { groups: {}, current: null, cloud: { url: 'https://rcajnmkktjntwhlxsxhd.supabase.co', key: 'sb_publishable_Pt-nBg2Tytuk1H_K8oi4kw__AHSjmbM' } };
        let _sb = null, _user = null;
        let _mode = 'login';

        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }

        async function init() {
            _sb = supabase.createClient(_config.cloud.url, _config.cloud.key);
            const { data: { session } } = await _sb.auth.getSession();
            if (session) { onLogin(session.user); }
            lucide.createIcons();
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPassword').value;
            const err = document.getElementById('authError');
            try {
                let res;
                if (_mode === 'login') res = await _sb.auth.signInWithPassword({ email, password: pass });
                else res = await _sb.auth.signUp({ email, password: pass });
                if (res.error) throw res.error;
                if (_mode === 'login') onLogin(res.data.user);
                else showToast("Check email!");
            } catch (e) { err.innerText = e.message; err.style.display = 'block'; }
        }

        async function onLogin(u) {
            _user = u;
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('userName').innerText = u.email.split('@')[0];
            document.getElementById('avatar').innerText = u.email[0].toUpperCase();
            
            const { data } = await _sb.from('redir_pro').select('config_data').eq('user_id', u.id).single();
            if (data && data.config_data) {
                let cd = data.config_data;
                let newGroups = {};
                let migrated = false;
                Object.keys(cd.groups || {}).forEach(k => {
                    // Remove empty Default group
                    if (k === "Default" && Object.keys(cd.groups[k].redirects || {}).length === 0) {
                        migrated = true;
                        return;
                    }
                    if (k.startsWith('grp_')) {
                        newGroups[k] = cd.groups[k];
                    } else {
                        let gid = 'grp_' + Math.random().toString(36).substring(2, 8);
                        newGroups[gid] = { name: k, redirects: cd.groups[k].redirects || {} };
                        if (cd.current === k) cd.current = gid;
                        migrated = true;
                    }
                });
                cd.groups = newGroups;
                if (!cd.groups[cd.current]) cd.current = Object.keys(cd.groups)[0] || null;
                _config = { ..._config, ...cd };
                if (migrated) save();
            }
            
            render();
            fetchStats();
            setInterval(fetchStats, 10000); // Auto refresh every 10s
        }

        async function fetchStats() {
            if (!_sb || !_user) return;
            const { count } = await _sb.from('clicks').select('*', { count: 'exact', head: true }).eq('user_id', _user.id);
            document.getElementById('statClicks').innerText = count || 0;

            const { data } = await _sb.from('clicks').select('*').eq('user_id', _user.id).order('created_at', { ascending: false }).limit(5);
            if (data && data.length > 0) {
                const html = data.map(c => `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
                    <span>🎯 Post: ${c.post_id}</span>
                    <span style="color:var(--primary)">${new Date(c.created_at).toLocaleTimeString()}</span>
                </div>`).join('');
                document.getElementById('recentTraffic').innerHTML = html;
            }
        }

        function render() {
            const list = document.getElementById('groupList');
            list.innerHTML = '';
            Object.keys(_config.groups).forEach(gId => {
                const g = _config.groups[gId];
                const div = document.createElement('div');
                div.className = `group-item ${gId === _config.current ? 'active' : ''}`;
                div.innerHTML = `<i data-lucide="folder" size="16"></i> ${g.name}`;
                div.onclick = () => { _config.current = gId; render(); };
                list.appendChild(div);
            });
            
            if (!_config.current || !_config.groups[_config.current]) {
                document.getElementById('currentGroup').innerText = "Dashboard (No Groups)";
                document.getElementById('statRedirects').innerText = "0";
                document.getElementById('mapList').innerHTML = '';
                document.getElementById('scriptBox').innerText = "// Please create a group first.";
                lucide.createIcons();
                return;
            }
            
            const group = _config.groups[_config.current];
            const mList = document.getElementById('mapList');
            mList.innerHTML = '';
            let total = 0;
            Object.keys(group.redirects).forEach(id => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td style="font-family:monospace; color:var(--primary)">${id}</td><td>${group.redirects[id]}</td><td style="text-align:right"><button class="btn-danger" onclick="delMap('${id}')">Del</button></td>`;
                mList.appendChild(tr);
                total++;
            });
            
            document.getElementById('statRedirects').innerText = total;
            document.getElementById('currentGroup').innerText = group.name;
            updateScript();
            lucide.createIcons();
        }

        function updateScript() {
            if (!_config.current) return;
            const gId = _config.current;
            const groupName = _config.groups[gId].name;
            const salt = Math.random().toString(36).substring(2, 10);
            const rv = 'p_' + salt;
            
            const script = `<script>(function(){
                /* uid: ${_user.id.substring(0,8)} | gid: ${gId} | s: ${salt} */
                var ${rv} = location.href.match(/(?:post|id)\\/(\\d+)/) || location.href.match(/\\d{5,}/);
                if(!${rv}) return;
                var pid = ${rv}[1] || ${rv}[0];
                var u = 'https://rcajnmkktjntwhlxsxhd.supabase.co';
                var k = 'sb_publishable_Pt-nBg2Tytuk1H_K8oi4kw__AHSjmbM';
                fetch(u+'/rest/v1/redir_pro?select=config_data&user_id=eq.${_user.id}',{headers:{'apikey':k,'Authorization':'Bearer '+k}})
                .then(r=>r.json()).then(j=>{
                    if(!j || !j[0] || !j[0].config_data) return;
                    var grp = j[0].config_data.groups['${gId}'];
                    if(!grp || !grp.redirects) return;
                    var m = grp.redirects[pid];
                    if(m) {
                        fetch(u+'/rest/v1/clicks',{method:'POST',headers:{'apikey':k,'Authorization':'Bearer '+k,'Content-Type':'application/json'},
                        body:JSON.stringify({user_id:'${_user.id}',group_name:'${groupName}',group_id:'${gId}',post_id:pid})})
                        .then(()=>location.replace(m)).catch(()=>location.replace(m));
                    }
                }).catch(e=>{});
            })()<\/script>`;
            document.getElementById('scriptBox').innerText = script;
        }

        async function addMap() {
            if (!_config.current) return showToast("Create a group first!");
            const id = document.getElementById('newId').value;
            const url = document.getElementById('newUrl').value;
            if (!id || !url) return;
            _config.groups[_config.current].redirects[id] = url;
            await save(); render();
            document.getElementById('newId').value = '';
            document.getElementById('newUrl').value = '';
        }

        async function save() {
            if (!_user) return;
            const { error } = await _sb.from('redir_pro').upsert({ user_id: _user.id, config_data: _config }, { onConflict: 'user_id' });
            if (error) showToast("Save failed: " + error.message);
        }

        async function createGroup() {
            const name = prompt("Enter Group Name:");
            if (!name) return;
            const gid = 'grp_' + Math.random().toString(36).substring(2, 8);
            _config.groups[gid] = { name: name, redirects: {} };
            _config.current = gid;
            await save();
            render();
            showToast("Group created!");
        }

        async function delMap(id) {
            if (!confirm("Delete this redirect?")) return;
            delete _config.groups[_config.current].redirects[id];
            await save();
            render();
            showToast("Deleted!");
        }

        function copyScript() {
            const text = document.getElementById('scriptBox').innerText;
            navigator.clipboard.writeText(text);
            showToast("Script copied!");
        }

        function toggleMode() { 
            _mode = _mode === 'login' ? 'signup' : 'login'; 
            document.querySelector('h2').innerText = _mode === 'login' ? 'Welcome' : 'Join Us';
            document.querySelector('.btn-primary').innerText = _mode === 'login' ? 'Login' : 'Sign Up';
        }
        async function logout() { await _sb.auth.signOut(); location.reload(); }
        init();
    </script>
</body>
</html>
