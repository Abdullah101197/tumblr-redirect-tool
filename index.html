<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min-Redir Pro</title>
    <style>
        :root { --p: #6366f1; --bg: #050505; --c: #111; --t: #fff; }
        body { background: var(--bg); color: var(--t); font-family: 'Inter', sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .box { width: 100%; max-width: 440px; background: var(--c); padding: 2rem; border-radius: 16px; border: 1px solid #222; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h1 { font-size: 1.1rem; margin: 0 0 1.5rem; letter-spacing: 1px; color: var(--p); text-transform: uppercase; text-align: center; }
        label { display: block; font-size: 0.75rem; color: #666; margin-bottom: 0.5rem; font-weight: 600; }
        textarea, input { width: 100%; background: #000; border: 1px solid #222; color: #fff; padding: 12px; margin-bottom: 1.2rem; border-radius: 8px; box-sizing: border-box; font-family: monospace; outline: none; transition: border-color 0.2s; }
        textarea:focus, input:focus { border-color: var(--p); }
        button { width: 100%; background: var(--p); color: #fff; border: 0; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        #o { margin-top: 1.5rem; display: none; background: #000; padding: 15px; font-family: monospace; font-size: 11px; word-break: break-all; border: 1px solid #222; border-radius: 8px; position: relative; }
        #o::before { content: 'GENERATED SCRIPT'; display: block; color: #444; margin-bottom: 8px; font-size: 9px; }
        .copy { position: absolute; top: 10px; right: 10px; font-size: 9px; color: var(--p); cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Min-Redir Pro</h1>
        <label>SHIFT KEY (1-9)</label>
        <input id="k" type="number" value="5" min="1" max="9">
        <label>MAPPINGS (POST_ID,TARGET_URL)</label>
        <textarea id="m" placeholder="72608581021,https://site.com" rows="6"></textarea>
        <button onclick="g()">GENERATE MINIMAL SCRIPT</button>
        <div id="o"><span class="copy" onclick="cp()">COPY</span><code id="res"></code></div>
    </div>
    <script>
        const $ = i => document.getElementById(i);
        function g() {
            const k = parseInt($('k').value) || 5;
            const m = $('m').value.split('\n').reduce((a, l) => {
                const [i, u] = l.split(',');
                if (i && u) a[i.trim()] = u.trim();
                return a;
            }, {});
            
            if (!Object.keys(m).length) return alert('Error');

            // Ultra-Compact Payload
            const p = `m=${JSON.stringify(m)};u=m[location.pathname.match(/\\d+/)];u&&location.replace(u)`;
            
            // Ultra-Compact Obfuscation
            const enc = btoa(p.split('').map(c => String.fromCharCode(c.charCodeAt(0) + k)).join(''));
            
            // Perfect & Shortest Stub
            const stub = `<script>eval(atob("${enc}").replace(/./g,c=>String.fromCharCode(c.charCodeAt()-${k})))<\/script>`;
            
            $('res').innerText = stub;
            $('o').style.display = 'block';
        }
        function cp() {
            navigator.clipboard.writeText($('res').innerText);
            document.querySelector('.copy').innerText = 'Done';
        }
    </script>
</body>
</html>
